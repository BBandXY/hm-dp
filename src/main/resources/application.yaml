server:
  port: ${SERVER_PORT:8081}
spring:
  application:
    name: hmdp
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/hmdp?useSSL=false&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略空字段
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_SIZE:5MB}
      max-request-size: ${MAX_UPLOAD_REQUEST_SIZE:6MB}
mybatis-plus:
  type-aliases-package: com.hmdp.entity
logging:
  level:
    com.hmdp: ${LOG_LEVEL:info}
hmdp:
  seckill:
    consumer-name: ${SECKILL_CONSUMER_NAME:c1}
    max-retries: ${SECKILL_MAX_RETRIES:5}
    reconcile-initial-delay-ms: ${SECKILL_RECONCILE_INITIAL_DELAY_MS:30000}
    reconcile-delay-ms: ${SECKILL_RECONCILE_DELAY_MS:60000}
    reconcile-grace-ms: ${SECKILL_RECONCILE_GRACE_MS:60000}
    reconcile-batch-size: ${SECKILL_RECONCILE_BATCH_SIZE:100}
  marketing:
    consumer-name: ${MARKETING_CONSUMER_NAME:marketing-c1}
    max-retries: ${MARKETING_MAX_RETRIES:5}
    publish-retry-ms: ${MARKETING_PUBLISH_RETRY_MS:5000}
    expire-cron: "${MARKETING_EXPIRE_CRON:0 5 * * * ?}"
  blog-like:
    flush-initial-delay-ms: ${BLOG_LIKE_FLUSH_INITIAL_DELAY_MS:5000}
    flush-delay-ms: ${BLOG_LIKE_FLUSH_DELAY_MS:1000}
    batch-size: ${BLOG_LIKE_BATCH_SIZE:200}
    reconcile-initial-delay-ms: ${BLOG_LIKE_RECONCILE_INITIAL_DELAY_MS:30000}
    reconcile-delay-ms: ${BLOG_LIKE_RECONCILE_DELAY_MS:60000}
    reconcile-interval-ms: ${BLOG_LIKE_RECONCILE_INTERVAL_MS:600000}
    reconcile-batch-size: ${BLOG_LIKE_RECONCILE_BATCH_SIZE:200}
    sync-log-retention-days: ${BLOG_LIKE_SYNC_LOG_RETENTION_DAYS:7}
    sync-log-cleanup-cron: "${BLOG_LIKE_SYNC_LOG_CLEANUP_CRON:0 30 3 * * ?}"
